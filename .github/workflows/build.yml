name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate package
        shell: ${{ matrix.shell }}
        run: ./build.ps1 test
      - uses: actions/cache@v4
        with:
          path: .cache/virtio-win
          key: virtio-${{ hashFiles('src/Drivers/virtio-win.json') }}
      - name: Build distribution with VirtIO drivers
        shell: ${{ matrix.shell }}
        run: ./build.ps1 package
      - uses: actions/upload-artifact@v4
        with:
          name: ToProxmox-${{ matrix.shell }}
          path: dist/ToProxmox.cmd
          if-no-files-found: error
